spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/full-stack-ecommerce?useSSL=false&useUnicode=yes&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:ecommerceapp}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# --- Spring Data REST ---
spring.data.rest.base-path=/api
spring.data.rest.detection-strategy=annotated

## issuer url must ends with "/"
okta.oauth2.issuer=https://dev-qymz162zoop22nv6.us.auth0.com/
okta.oauth2.client-id=4rPTlBysTjLFhAZCtSiY1FUYfoktESPE
okta.oauth2.audience=https://localhost:8443

# --- CORS ---
allowed.origins=https://localhost:4200

# --- OAuth2 resource server (Auth0) ---
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://dev-qymz162zoop22nv6.us.auth0.com/
spring.security.oauth2.resourceserver.jwt.audiences=https://localhost:8443

# --- HTTPS configuration ---

# Server web port
server.port=8443

# Enable HTTPS support (only accept HTTPS requests)
server.ssl.enabled=true

# Alias that identifies the key in the key store
server.ssl.key-alias=luv2code

# Keystore location
server.ssl.key-store=classpath:luv2code-keystore.p12

# Keystore password
server.ssl.key-store-password=secret

# Keystore format
server.ssl.key-store-type=PKCS12

# Stripe Configuration
stripe.key.secret=${STRIPE_SECRET_KEY}